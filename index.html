<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rampa DPO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      background-image: radial-gradient(circle, #192030 1px, transparent 1px);
      background-size: 28px 28px;
      color: #e6edf3;
      font-family: 'Courier New', Courier, monospace;
      padding: 2.5rem;
      min-height: 100vh;
    }
    .wrapper { max-width: 1050px; }

    /* EDIT BUTTON */
    .edit-btn {
      background: transparent;
      border: 1px solid #30363d;
      color: #8b949e;
      font-family: inherit;
      font-size: 0.7rem;
      padding: 0.35rem 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
      transition: border-color 0.15s, color 0.15s;
    }
    .edit-btn:hover { border-color: #8b949e; color: #e6edf3; }

    /* CONFIG PANEL */
    .config {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .config-section {
      font-size: 0.6rem; text-transform: uppercase;
      letter-spacing: 0.1em; color: #8b949e; margin-bottom: 0.75rem;
    }
    .config-top {
      display: grid; grid-template-columns: 1fr 1fr 2fr;
      gap: 1.25rem; margin-bottom: 0.5rem;
    }
    .config-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem; margin-bottom: 0.5rem;
    }
    .threshold-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem;
    }
    .col-h {
      font-size: 0.68rem; font-weight: bold; text-transform: uppercase;
      color: #e6edf3; padding-bottom: 0.4rem;
      border-bottom: 1px solid #30363d; margin-bottom: 0.6rem;
    }
    .fl {
      display: block; font-size: 0.57rem; color: #484f58;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.18rem;
    }
    .config input[type="text"],
    .config input[type="number"] {
      width: 100%; background: #1c2128; border: 1px solid #30363d;
      color: #e6edf3; font-family: 'Courier New', monospace;
      font-size: 0.75rem; padding: 0.28rem 0.45rem;
      margin-bottom: 0.5rem; outline: none;
    }
    .config input:focus { border-color: #8b949e; }
    .config input[type="color"] {
      width: 38px; height: 26px; padding: 2px;
      background: #1c2128; border: 1px solid #30363d;
      cursor: pointer; margin-bottom: 0.5rem; display: block;
    }
    .sep { border: none; border-top: 1px solid #30363d; margin: 1.25rem 0; }

    /* HEADER */
    .header { margin-bottom: 1.5rem; }
    .header-label {
      font-size: 0.63rem; text-transform: uppercase;
      color: #8b949e; letter-spacing: 0.12em; margin-bottom: 0.3rem;
    }
    .header-h1 {
      font-size: 2.4rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: 0.03em; line-height: 1;
    }
    .header-sub {
      font-size: 0.8rem; color: #8b949e;
      margin-top: 0.6rem; line-height: 1.65; max-width: 700px;
    }
    .header-sub strong { color: #e6edf3; }

    /* LEGEND */
    .legend {
      display: flex; flex-wrap: wrap; gap: 1.5rem;
      margin-bottom: 2.5rem; font-size: 0.65rem;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .legend-item { display: flex; align-items: center; gap: 0.35rem; color: #8b949e; }
    .legend-pip { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* CARDS */
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1rem; }
    .card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 0.5rem; }
    .medal-svg { width: 96px; height: 96px; margin-bottom: 0.75rem; }
    .card-time {
      font-size: 0.57rem; text-transform: uppercase;
      color: #484f58; letter-spacing: 0.1em; margin-bottom: 0.22rem;
    }
    .card-status-row {
      display: flex; align-items: center; justify-content: center;
      gap: 0.3rem; font-size: 0.65rem; text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 0.3rem;
    }
    .status-pip { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .card-score {
      font-size: 2.4rem; font-weight: 900;
      letter-spacing: -0.02em; line-height: 1; margin-bottom: 0.5rem;
    }
    .card-desc { font-size: 0.68rem; color: #8b949e; line-height: 1.5; }
    .card-delta { font-size: 0.68rem; font-weight: bold; margin-top: 0.4rem; }

    /* TIMELINE */
    .timeline { position: relative; padding: 0.5rem 0; margin-top: 0.25rem; }
    .tl-track {
      position: absolute; top: calc(0.5rem + 5px);
      left: calc(12.5%); right: calc(12.5% + 1px);
      height: 1px; background: #484f58;
    }
    .tl-track::after {
      content: ''; position: absolute; right: -6px; top: -4px;
      border-left: 7px solid #484f58;
      border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    }
    .tl-dashed {
      position: absolute; top: calc(0.5rem + 4.5px);
      right: 0; width: calc(12.5% - 1px); height: 2px;
      background: repeating-linear-gradient(
        90deg, #30363d 0, #30363d 4px, transparent 4px, transparent 9px
      );
    }
    .tl-cols { display: grid; grid-template-columns: repeat(4, 1fr); position: relative; }
    .tl-col { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
    .tl-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #0d1117; border: 2px solid #8b949e; position: relative; z-index: 1;
    }
    .tl-p { font-size: 0.62rem; text-transform: uppercase; color: #8b949e; letter-spacing: 0.05em; font-weight: bold; }
    .tl-ps { font-size: 0.57rem; color: #484f58; text-align: center; line-height: 1.4; }

    /* EMPTY STATE */
    .empty-hint {
      text-align: center; padding: 3rem 1rem;
      color: #484f58; font-size: 0.8rem; line-height: 1.8;
    }
    .empty-hint strong { color: #8b949e; }
  </style>
</head>
<body>
<div class="wrapper">
  <button class="edit-btn" id="editBtn" onclick="toggleConfig()">✕ Fechar edição</button>
  <div class="config" id="config"></div>
  <div id="vis"></div>
</div>

<script>
const state = {
  pillar: '',
  unit: '',
  milestones: [
    { timeLabel:'HOJE',        period:'',  periodSub:'', score:'', desc:'' },
    { timeLabel:'EM 1 MÊS',   period:'',  periodSub:'', score:'', desc:'' },
    { timeLabel:'EM 2 MESES', period:'',  periodSub:'', score:'', desc:'' },
    { timeLabel:'META',        period:'',  periodSub:'', score:'', desc:'' },
  ],
  thresholds: [
    { label:'NÃO QUALIFICADO', min:0,    color:'#ef4444' },
    { label:'QUALIFIED',       min:65,   color:'#22c55e' },
    { label:'CERTIFIED',       min:76.8, color:'#f59e0b' },
    { label:'SUSTAINABLE',     min:78,   color:'#3b82f6' },
  ],
  configOpen: true,
};

const PENDING = { label:'PENDENTE', color:'#484f58' };

function parseScore(s) {
  if (!s || !s.trim()) return null;
  return parseFloat(s.replace(',', '.'));
}

function sortedThresholds() {
  return [...state.thresholds].sort((a, b) => a.min - b.min);
}

function getStatus(score) {
  if (score === null) return PENDING;
  const ts = sortedThresholds();
  let result = ts[0];
  for (const t of ts) {
    if (score >= t.min) result = t;
    else break;
  }
  return result;
}

function hexRgb(hex) {
  const r = parseInt(hex.slice(1,3),16),
        g = parseInt(hex.slice(3,5),16),
        b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function medal(color) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = (i * 36 - 90) * Math.PI / 180;
    const r = i % 2 === 0 ? 20 : 9;
    pts.push(`${(50 + r * Math.cos(a)).toFixed(1)},${(46 + r * Math.sin(a)).toFixed(1)}`);
  }
  const bg    = `rgba(${hexRgb(color)},0.09)`;
  const ring2 = `rgba(${hexRgb(color)},0.45)`;
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="47" fill="${bg}" stroke="${color}" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="37" fill="none" stroke="${ring2}" stroke-width="1.2" stroke-dasharray="3.5 3"/>
    <polygon points="${pts.join(' ')}" fill="${color}"/>
    <text x="50" y="82" text-anchor="middle" font-family="Courier New" font-size="6.5" fill="${ring2}" letter-spacing="1.5">DPO·2026</text>
  </svg>`;
}

function thresholdRangeStr(i) {
  const ts = sortedThresholds();
  if (i === 0) {
    const next = ts[1];
    return `abaixo de ${next ? next.min : '?'}`;
  }
  if (i === ts.length - 1) return `a partir de ${ts[i].min}`;
  const nextMin = ts[i + 1].min;
  const upper = (nextMin - 0.1).toFixed(1).replace('.', ',');
  return `${ts[i].min} – ${upper}`;
}

function hasAnyData() {
  return state.milestones.some(m => m.score.trim() !== '') || state.pillar.trim() !== '';
}

function renderVis() {
  const scores = state.milestones.map(m => parseScore(m.score));
  const target = scores[3];
  const targetStatus = getStatus(target);

  if (!hasAnyData()) {
    document.getElementById('vis').innerHTML = `
      <div class="empty-hint">
        <strong>Preencha os dados acima para gerar a rampa.</strong><br>
        Informe o pilar, as pontuações de cada marco e a meta final.
      </div>`;
    return;
  }

  const targetDisplay = target !== null
    ? `<span style="color:${targetStatus.color}">${state.milestones[3].score}${state.unit ? ' ' + state.unit : ''}</span>`
    : `<span style="color:#484f58">?</span>`;

  const currentScore = state.milestones[0].score;
  const subtitleMiddle = state.milestones.slice(1, 3)
    .filter(m => m.periodSub.trim())
    .map(m => `<strong>${m.periodSub}</strong>${m.period ? ' em ' + m.period : ''}`)
    .join(', ');

  const subtitle = currentScore && subtitleMiddle
    ? `Partindo dos <strong>${currentScore}${state.unit ? ' ' + state.unit : ''} pontos</strong> de hoje, o ganho vem de: ${subtitleMiddle}.`
    : currentScore
    ? `Pontuação atual: <strong>${currentScore}${state.unit ? ' ' + state.unit : ''}</strong>.`
    : `Configure as pontuações acima para ver o resumo.`;

  const ts = sortedThresholds();
  const legend = ts.map((t, i) => `
    <div class="legend-item">
      <div class="legend-pip" style="background:${t.color}"></div>
      <span>${t.label}</span>
      <span style="color:#30363d;margin:0 0.15rem">·</span>
      <span style="color:#484f58">${thresholdRangeStr(i)}</span>
    </div>`).join('');

  const cards = state.milestones.map((m, i) => {
    const score = scores[i];
    const st = getStatus(score);
    const prev = i > 0 ? scores[i - 1] : null;
    const delta = (score !== null && prev !== null) ? score - prev : null;
    const deltaLabel = delta !== null
      ? `↑ ${delta >= 0 ? '+' : ''}${delta.toFixed(1).replace('.', ',')} p.p.`
      : null;
    const deltaColor = delta !== null ? (delta >= 0 ? '#f59e0b' : '#ef4444') : '';
    const scoreDisplay = score !== null ? `${m.score}${state.unit ? ' ' + state.unit : ''}` : '—';
    const scoreColor = score !== null ? '#e6edf3' : '#484f58';

    return `<div class="card">
      <div class="medal-svg">${medal(st.color)}</div>
      <div class="card-time">${m.timeLabel || `MARCO ${i+1}`}</div>
      <div class="card-status-row">
        <div class="status-pip" style="background:${st.color}"></div>
        <span style="color:${st.color}">${st.label}</span>
      </div>
      <div class="card-score" style="color:${scoreColor}">${scoreDisplay}</div>
      <div class="card-desc">${m.desc || '&nbsp;'}</div>
      ${deltaLabel ? `<div class="card-delta" style="color:${deltaColor}">${deltaLabel}</div>` : ''}
    </div>`;
  }).join('');

  const tlCols = state.milestones.map(m => `
    <div class="tl-col">
      <div class="tl-dot"></div>
      <div class="tl-p">${m.period || '—'}</div>
      <div class="tl-ps">${m.periodSub || ''}</div>
    </div>`).join('');

  document.getElementById('vis').innerHTML = `
    <div class="header">
      <div class="header-label">${state.pillar || 'Pilar'} · Meta para os próximos meses</div>
      <div class="header-h1">RAMPA ATÉ ${targetDisplay}</div>
      <div class="header-sub">${subtitle}</div>
    </div>
    <div class="legend">${legend}</div>
    <div class="cards">${cards}</div>
    <div class="timeline">
      <div class="tl-track"></div>
      <div class="tl-dashed"></div>
      <div class="tl-cols">${tlCols}</div>
    </div>`;
}

function setupConfig() {
  const cfg = document.getElementById('config');

  let html = `
    <div class="config-section">Configurações gerais</div>
    <div class="config-top">
      <div>
        <div class="col-h">Pilar</div>
        <label class="fl">Nome do pilar</label>
        <input type="text" id="cfg_pillar" placeholder="ex: Pilar Gente" value="${state.pillar}">
      </div>
      <div>
        <div class="col-h">Unidade</div>
        <label class="fl">Ex: %, pts, pontos</label>
        <input type="text" id="cfg_unit" placeholder="deixar vazio = sem unidade" value="${state.unit}">
      </div>
    </div>

    <hr class="sep">
    <div class="config-section">Marcos da rampa</div>
    <div class="config-grid">`;

  const timePlaceholders = ['HOJE', 'EM 1 MÊS', 'EM 2 MESES', 'META'];
  const periodPlaceholders = ['DEZ/26', 'JAN/27', 'FEV/27', 'META'];
  const subPlaceholders = ['Resultado atual', 'O que pontua nesse mês', 'O que pontua nesse mês', 'Meta final'];
  const scorePlaceholders = ['68,8', '72,0', '75,0', '78'];
  const descPlaceholders = [
    'Resultado atual da auditoria.',
    'Descrição do que pontua.',
    'Descrição do que pontua.',
    'Meta do pilar.',
  ];

  for (let i = 0; i < state.milestones.length; i++) {
    const m = state.milestones[i];
    html += `
      <div>
        <div class="col-h">Marco ${i + 1}</div>
        <label class="fl">Rótulo de tempo</label>
        <input type="text" id="m${i}_timeLabel" placeholder="${timePlaceholders[i]}" value="${m.timeLabel}">
        <label class="fl">Período</label>
        <input type="text" id="m${i}_period" placeholder="${periodPlaceholders[i]}" value="${m.period}">
        <label class="fl">Sublabel (linha do tempo)</label>
        <input type="text" id="m${i}_periodSub" placeholder="${subPlaceholders[i]}" value="${m.periodSub}">
        <label class="fl">Pontuação</label>
        <input type="text" id="m${i}_score" placeholder="${scorePlaceholders[i]}" value="${m.score}">
        <label class="fl">Descrição do card</label>
        <input type="text" id="m${i}_desc" placeholder="${descPlaceholders[i]}" value="${m.desc}">
      </div>`;
  }

  html += `
    </div>
    <hr class="sep">
    <div class="config-section">Limiares de status (do menor para o maior)</div>
    <div class="threshold-grid">`;

  for (let i = 0; i < state.thresholds.length; i++) {
    const t = state.thresholds[i];
    html += `
      <div>
        <div class="col-h">Status ${i + 1}</div>
        <label class="fl">Nome</label>
        <input type="text" id="t${i}_label" value="${t.label}">
        <label class="fl">Pontuação mínima</label>
        <input type="number" step="0.1" id="t${i}_min" value="${t.min}">
        <label class="fl">Cor</label>
        <input type="color" id="t${i}_color" value="${t.color}">
      </div>`;
  }

  html += `</div>`;
  cfg.innerHTML = html;

  document.getElementById('cfg_pillar').addEventListener('input', function() {
    state.pillar = this.value; renderVis();
  });
  document.getElementById('cfg_unit').addEventListener('input', function() {
    state.unit = this.value; renderVis();
  });

  for (let i = 0; i < state.milestones.length; i++) {
    ['timeLabel', 'period', 'periodSub', 'score', 'desc'].forEach(key => {
      const el = document.getElementById(`m${i}_${key}`);
      if (el) el.addEventListener('input', function() {
        state.milestones[i][key] = this.value;
        renderVis();
      });
    });
  }

  for (let i = 0; i < state.thresholds.length; i++) {
    ['label', 'min', 'color'].forEach(key => {
      const el = document.getElementById(`t${i}_${key}`);
      if (!el) return;
      el.addEventListener('input', function() {
        state.thresholds[i][key] = key === 'min'
          ? (parseFloat(this.value) || 0)
          : this.value;
        renderVis();
      });
    });
  }
}

function toggleConfig() {
  state.configOpen = !state.configOpen;
  document.getElementById('config').style.display = state.configOpen ? 'block' : 'none';
  document.getElementById('editBtn').textContent = state.configOpen
    ? '✕ Fechar edição'
    : '⚙ Editar dados';
}

setupConfig();
renderVis();
</script>
</body>
</html>
